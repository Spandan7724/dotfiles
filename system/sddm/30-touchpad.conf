# SDDM draws the login screen on Xorg, which never sees the Hyprland input
# settings. libinput leaves tap-to-click off by default there, so tapping the
# touchpad did nothing on the greeter. Mirror the Hyprland touchpad block.
Section "InputClass"
        Identifier "touchpad"
        MatchIsTouchpad "on"
        Driver "libinput"
        Option "Tapping" "on"
        Option "NaturalScrolling" "false"
EndSection
