# /etc/systemd/oomd.conf.d/10-dotfiles.conf
# systemd-oomd acts only on cgroups that opt in. The user's app.slice opts in
# (~/.config/systemd/user/app.slice.d/10-oomd.conf), so apps launched through
# uwsm-app are the candidates and the Hyprland session itself is not.
[OOM]
SwapUsedLimit=90%
DefaultMemoryPressureLimit=60%
DefaultMemoryPressureDurationSec=20s
