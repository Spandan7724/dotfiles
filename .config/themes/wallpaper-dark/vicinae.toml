# Vicinae colours for this theme. Generated by themes/generate.py from colors.toml.
[meta]
version = 1
name = "Dotfiles"
description = "The current dotfiles theme"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
background = "#0f1416"
foreground = "#dee3e6"
secondary_background = "#252b2d"
border = "#2c3133"
accent = "#89d0ed"
accent_foreground = "#000000"

[colors.main_window]
border = "#2c3133"

[colors.accents]
blue = "#98ccf9"
green = "#8ed5b1"
magenta = "#cebdfe"
orange = "#ffb4a8"
purple = "#cebdfe"
red = "#ffb2bd"
yellow = "#e2c46d"
cyan = "#82d3e1"

[colors.text]
default = "#dee3e6"
muted = "#c0c8cc"
danger = "#ffb4ab"
success = "#8ed5b1"

[colors.text.selection]
background = "#89d0ed"
foreground = "#000000"

[colors.input]
border = "#2c3133"
border_focus = "#89d0ed"
border_error = "#ffb4ab"

[colors.list.item.hover]
background = "#191e20"
foreground = "#dee3e6"

[colors.list.item.selection]
background = "#354a53"
foreground = "#dee3e6"
secondary_background = "#24292b"
secondary_foreground = "#dee3e6"

[colors.grid.item]
background = "#252b2d"

[colors.grid.item.selection]
outline = "#89d0ed"

[colors.loading]
bar = "#89d0ed"
spinner = "#89d0ed"
