# Profile colors for the monochrome-dark theme.
# Loaded as a dunstrc.d drop-in, so these override the base dunstrc.

[global]
    separator_color = frame
    icon_theme = "Papirus-Dark, Papirus, Adwaita"

[urgency_low]
    background = "#141414e6"
    foreground = "#a2a2a2"
    frame_color = "#ffffff1a"

[urgency_normal]
    background = "#141414f2"
    foreground = "#f5f5f5"
    frame_color = "#ffffff2b"

[urgency_critical]
    background = "#1a1010f2"
    foreground = "#ffffff"
    frame_color = "#ff6b6b"
