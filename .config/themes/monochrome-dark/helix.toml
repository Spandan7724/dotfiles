"ui.cursor.insert" = { fg = "background", bg = "light" }
"ui.cursor.match" = { fg = "background", bg = "muted" }
"ui.cursor.normal" = { fg = "background", bg = "foreground" }
"ui.cursor.select" = { fg = "background", bg = "light" }
"ui.cursorline.primary" = { bg = "cursorline" }
"ui.gutter" = { bg = "background" }
"ui.help" = { fg = "foreground", bg = "surface" }
"ui.highlight" = { bg = "selection" }
"ui.linenr" = "muted"
"ui.linenr.selected" = "foreground"
"ui.menu" = { fg = "foreground", bg = "surface" }
