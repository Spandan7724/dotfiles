attribute = "muted"
comment = { fg = "muted", modifiers = ["italic"] }
constructor = "foreground"
constant = "light"
"constant.builtin" = "foreground"
"constant.numeric" = "light"
function = "foreground"
"function.builtin" = "foreground"
"function.macro" = { fg = "foreground", modifiers = ["bold"] }
"function.method" = "foreground"
keyword = { fg = "foreground", modifiers = ["bold"] }
label = "light"
namespace = "light"
operator = "foreground"
punctuation = "muted"
special = "light"
string = "light"
tag = "foreground"
type = "foreground"
"type.builtin" = "light"
variable = "foreground"
"variable.builtin" = "light"
"variable.other.member" = "light"
"variable.parameter" = "foreground"

"markup.bold" = { modifiers = ["bold"] }
"markup.heading" = { fg = "foreground", modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
