# Vicinae colours for this theme. Generated by themes/generate.py from colors.toml.
[meta]
version = 1
name = "Dotfiles"
description = "The current dotfiles theme"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
background = "#000000"
foreground = "#f5f5f5"
secondary_background = "#1b1b1b"
border = "#222222"
accent = "#ffffff"
accent_foreground = "#000000"

[colors.main_window]
border = "#222222"

[colors.accents]
blue = "#87afd7"
green = "#87af87"
magenta = "#af87d7"
orange = "#d7875f"
purple = "#af87d7"
red = "#d75f5f"
yellow = "#d7af5f"
cyan = "#87d7d7"

[colors.text]
default = "#f5f5f5"
muted = "#a2a2a2"
danger = "#d75f5f"
success = "#87af87"

[colors.text.selection]
background = "#ffffff"
foreground = "#000000"

[colors.input]
border = "#222222"
border_focus = "#ffffff"
border_error = "#d75f5f"

[colors.list.item.hover]
background = "#0c0c0c"
foreground = "#f5f5f5"

[colors.list.item.selection]
background = "#303030"
foreground = "#ffffff"
secondary_background = "#181818"
secondary_foreground = "#f5f5f5"

[colors.grid.item]
background = "#1b1b1b"

[colors.grid.item.selection]
outline = "#ffffff"

[colors.loading]
bar = "#ffffff"
spinner = "#ffffff"
