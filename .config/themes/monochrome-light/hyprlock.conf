# Profile colors for the monochrome-light theme.
# Sourced by ~/.config/hypr/hyprlock.conf before the Matugen palette.
#
# Hyprlock blurs a screenshot of the desktop as its background, so the text has
# to read against the live wallpaper rather than a flat surface. The light
# profile therefore uses near-black text instead of a light-on-light pairing.

$lockFg = rgba(151515ff)
$lockFgMuted = rgba(3a3a3acc)
$lockAccent = rgba(000000aa)
$lockCheck = rgba(000000aa)
$lockFail = rgba(b00020cc)
$lockInner = rgba(ffffff26)
