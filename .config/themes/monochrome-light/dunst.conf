# Profile colors for the monochrome-light theme.
# Loaded as a dunstrc.d drop-in, so these override the base dunstrc.

[global]
    separator_color = frame
    icon_theme = "Papirus, Papirus-Dark, Adwaita"

[urgency_low]
    background = "#f4f4f4e6"
    foreground = "#666666"
    frame_color = "#00000014"

[urgency_normal]
    background = "#f4f4f4f7"
    foreground = "#151515"
    frame_color = "#00000026"

[urgency_critical]
    background = "#fff1f1f7"
    foreground = "#151515"
    frame_color = "#b00020"
