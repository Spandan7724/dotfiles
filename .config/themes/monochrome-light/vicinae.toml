# Vicinae colours for this theme. Generated by themes/generate.py from colors.toml.
[meta]
version = 1
name = "Dotfiles"
description = "The current dotfiles theme"
variant = "light"
inherits = "vicinae-light"

[colors.core]
background = "#f4f4f4"
foreground = "#151515"
secondary_background = "#ffffff"
border = "#d5d5d5"
accent = "#000000"
accent_foreground = "#ffffff"

[colors.main_window]
border = "#d5d5d5"

[colors.accents]
blue = "#3f5f80"
green = "#3f6f3f"
magenta = "#654680"
orange = "#a85a32"
purple = "#654680"
red = "#a83232"
yellow = "#806420"
cyan = "#3f7070"

[colors.text]
default = "#151515"
muted = "#666666"
danger = "#a83232"
success = "#3f6f3f"

[colors.text.selection]
background = "#000000"
foreground = "#ffffff"

[colors.input]
border = "#d5d5d5"
border_focus = "#000000"
border_error = "#a83232"

[colors.list.item.hover]
background = "#e9e9e9"
foreground = "#151515"

[colors.list.item.selection]
background = "#c8c8c8"
foreground = "#000000"
secondary_background = "#dedede"
secondary_foreground = "#151515"

[colors.grid.item]
background = "#ffffff"

[colors.grid.item.selection]
outline = "#000000"

[colors.loading]
bar = "#000000"
spinner = "#000000"
