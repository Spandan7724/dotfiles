# Vicinae colours for this theme. Generated by themes/generate.py from colors.toml.
[meta]
version = 1
name = "Dotfiles"
description = "The current dotfiles theme"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
background = "#282828"
foreground = "#d4be98"
secondary_background = "#3c3836"
border = "#403d38"
accent = "#7daea3"
accent_foreground = "#000000"

[colors.main_window]
border = "#403d38"

[colors.accents]
blue = "#7daea3"
green = "#a9b665"
magenta = "#d3869b"
orange = "#e78a4e"
purple = "#d3869b"
red = "#ea6962"
yellow = "#d8a657"
cyan = "#89b482"

[colors.text]
default = "#d4be98"
muted = "#928374"
danger = "#ea6962"
success = "#a9b665"

[colors.text.selection]
background = "#7daea3"
foreground = "#000000"

[colors.input]
border = "#403d38"
border_focus = "#7daea3"
border_error = "#ea6962"

[colors.list.item.hover]
background = "#31302e"
foreground = "#d4be98"

[colors.list.item.selection]
background = "#504945"
foreground = "#f2e5bc"
secondary_background = "#393733"
secondary_foreground = "#d4be98"

[colors.grid.item]
background = "#3c3836"

[colors.grid.item.selection]
outline = "#7daea3"

[colors.loading]
bar = "#7daea3"
spinner = "#7daea3"
