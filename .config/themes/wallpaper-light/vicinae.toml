# Vicinae colours for this theme. Generated by themes/generate.py from colors.toml.
[meta]
version = 1
name = "Dotfiles"
description = "The current dotfiles theme"
variant = "light"
inherits = "vicinae-light"

[colors.core]
background = "#f5fafd"
foreground = "#171c1f"
secondary_background = "#e4e9ec"
border = "#d6dbde"
accent = "#0a6780"
accent_foreground = "#ffffff"

[colors.main_window]
border = "#d6dbde"

[colors.accents]
blue = "#2a638a"
green = "#216a4d"
magenta = "#64558f"
orange = "#904b40"
purple = "#64558f"
red = "#8e4956"
yellow = "#725c0c"
cyan = "#006875"

[colors.text]
default = "#171c1f"
muted = "#40484c"
danger = "#ba1a1a"
success = "#216a4d"

[colors.text.selection]
background = "#0a6780"
foreground = "#ffffff"

[colors.input]
border = "#d6dbde"
border_focus = "#0a6780"
border_error = "#ba1a1a"

[colors.list.item.hover]
background = "#eaeff2"
foreground = "#171c1f"

[colors.list.item.selection]
background = "#cfe6f1"
foreground = "#171c1f"
secondary_background = "#dfe4e7"
secondary_foreground = "#171c1f"

[colors.grid.item]
background = "#e4e9ec"

[colors.grid.item.selection]
outline = "#0a6780"

[colors.loading]
bar = "#0a6780"
spinner = "#0a6780"
