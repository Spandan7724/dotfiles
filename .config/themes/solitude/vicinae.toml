# Vicinae colours for this theme. Generated by themes/generate.py from colors.toml.
[meta]
version = 1
name = "Dotfiles"
description = "The current dotfiles theme"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
background = "#101315"
foreground = "#cacccc"
secondary_background = "#1b1e20"
border = "#2a2d2f"
accent = "#798186"
accent_foreground = "#000000"

[colors.main_window]
border = "#2a2d2f"

[colors.accents]
blue = "#7fa1b8"
green = "#93ad8a"
magenta = "#b392b0"
orange = "#de6145"
purple = "#b392b0"
red = "#d9705f"
yellow = "#d6b46e"
cyan = "#73a8a6"

[colors.text]
default = "#cacccc"
muted = "#8a9095"
danger = "#de6145"
success = "#93ad8a"

[colors.text.selection]
background = "#798186"
foreground = "#000000"

[colors.input]
border = "#2a2d2f"
border_focus = "#798186"
border_error = "#de6145"

[colors.list.item.hover]
background = "#191c1e"
foreground = "#cacccc"

[colors.list.item.selection]
background = "#343d41"
foreground = "#a5aeb4"
secondary_background = "#232627"
secondary_foreground = "#cacccc"

[colors.grid.item]
background = "#1b1e20"

[colors.grid.item.selection]
outline = "#798186"

[colors.loading]
bar = "#798186"
spinner = "#798186"
