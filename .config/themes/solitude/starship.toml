"$schema" = "https://starship.rs/config-schema.json"
format = "$directory$git_branch$git_status$python$rust$golang$nodejs\n$character"
palette = "theme"
[directory]
style = "bold foreground"
truncation_length = 3
[git_branch]
symbol = "󰘬 "
style = "accent"
[git_status]
style = "muted"
[python]
style = "yellow"
[rust]
style = "orange"
[golang]
style = "cyan"
[nodejs]
style = "green"
[character]
success_symbol = "[❯](accent)"
error_symbol = "[❯](bold error)"
[palettes.theme]
foreground = "#cacccc"
muted = "#8a9095"
accent = "#798186"
yellow = "#d6b46e"
orange = "#de6145"
cyan = "#73a8a6"
green = "#93ad8a"
error = "#de6145"
