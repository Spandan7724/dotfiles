# Palette from Omarchy's solitude theme, used by themes/generate.py.
mode = "dark"

accent = "#798186"
selection = "#343d41"
muted = "#8a9095"

background = "#101315"
dark_background = "#0c0e10"
darker_background = "#080a0b"
lighter_background = "#101315"

foreground = "#cacccc"
dark_foreground = "#4b4e55"
light_foreground = "#cbc2be"
bright_foreground = "#a5aeb4"

hyprland_active_border = "rgba(798186ee) rgba(caccccee)"
hyprland_inactive_border = "rgb(1e1e1e)"
active_border_color = "#a8adb0"
active_tab_background = "#798186"

red = "#d9705f"
yellow = "#d6b46e"
green = "#93ad8a"
cyan = "#73a8a6"
blue = "#7fa1b8"
magenta = "#b392b0"

bright_red = "#e88a78"
bright_yellow = "#e3c58a"
bright_green = "#a9c29f"
bright_cyan = "#8dbfbc"
bright_blue = "#97b5ca"
bright_magenta = "#c6a8c3"

orange = "#de6145"

# Status colours for errors, warnings, and success (notifications, the bar,
# the lock screen, menus, GTK and Qt apps). The desktop stays grey; terminals
# get the muted hues above, picked to sit on the grey background.
error = "#de6145"
warning = "#d6b46e"
success = "#93ad8a"

[apps]
helix = "ashen"
btop = "keep"

# Editor syntax (Doom, NvChad; Helix uses its built-in ashen). The palette
# above is greyscale, so code takes its colours from ashen, the theme Omarchy
# pairs with Solitude for Neovim.
[syntax]
keyword = "#b14242"
function = "#d5d5d5"
string = "#df6464"
type = "#4a8b8b"
constant = "#c4693d"
number = "#4a8b8b"
builtin = "#4a8b8b"
operator = "#d87c4a"
punctuation = "#949494"
comment = "#737373"
variable = "#b4b4b4"
bold_functions = true
italic_comments = true
