# Vicinae colours for this theme. Generated by themes/generate.py from colors.toml.
[meta]
version = 1
name = "Dotfiles"
description = "The current dotfiles theme"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
background = "#000000"
foreground = "#ffffff"
secondary_background = "#1a1a1a"
border = "#242424"
accent = "#8d8d8d"
accent_foreground = "#000000"

[colors.main_window]
border = "#242424"

[colors.accents]
blue = "#8d8d8d"
green = "#b6b6b6"
magenta = "#9b9b9b"
orange = "#b9b9b9"
purple = "#9b9b9b"
red = "#e5534b"
yellow = "#d7a95f"
cyan = "#b0b0b0"

[colors.text]
default = "#ffffff"
muted = "#7a7a7a"
danger = "#e5534b"
success = "#b6b6b6"

[colors.text.selection]
background = "#8d8d8d"
foreground = "#000000"

[colors.input]
border = "#242424"
border_focus = "#8d8d8d"
border_error = "#e5534b"

[colors.list.item.hover]
background = "#0d0d0d"
foreground = "#ffffff"

[colors.list.item.selection]
background = "#1a1a1a"
foreground = "#ffffff"
secondary_background = "#1a1a1a"
secondary_foreground = "#ffffff"

[colors.grid.item]
background = "#1a1a1a"

[colors.grid.item.selection]
outline = "#8d8d8d"

[colors.loading]
bar = "#8d8d8d"
spinner = "#8d8d8d"
