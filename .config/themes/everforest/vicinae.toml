# Vicinae colours for this theme. Generated by themes/generate.py from colors.toml.
[meta]
version = 1
name = "Dotfiles"
description = "The current dotfiles theme"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
background = "#2d353b"
foreground = "#d3c6aa"
secondary_background = "#343f44"
border = "#44494b"
accent = "#7fbbb3"
accent_foreground = "#000000"

[colors.main_window]
border = "#44494b"

[colors.accents]
blue = "#7fbbb3"
green = "#a7c080"
magenta = "#d699b6"
orange = "#e69875"
purple = "#d699b6"
red = "#e67e80"
yellow = "#dbbc7f"
cyan = "#83c092"

[colors.text]
default = "#d3c6aa"
muted = "#859289"
danger = "#e67e80"
success = "#a7c080"

[colors.text.selection]
background = "#7fbbb3"
foreground = "#000000"

[colors.input]
border = "#44494b"
border_focus = "#7fbbb3"
border_error = "#e67e80"

[colors.list.item.hover]
background = "#353c41"
foreground = "#d3c6aa"

[colors.list.item.selection]
background = "#3d484d"
foreground = "#fff9e8"
secondary_background = "#3e4446"
secondary_foreground = "#d3c6aa"

[colors.grid.item]
background = "#343f44"

[colors.grid.item.selection]
outline = "#7fbbb3"

[colors.loading]
bar = "#7fbbb3"
spinner = "#7fbbb3"
