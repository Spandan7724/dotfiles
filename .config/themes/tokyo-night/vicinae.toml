# Vicinae colours for this theme. Generated by themes/generate.py from colors.toml.
[meta]
version = 1
name = "Dotfiles"
description = "The current dotfiles theme"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
background = "#1a1b26"
foreground = "#c0caf5"
secondary_background = "#24283b"
border = "#313443"
accent = "#7aa2f7"
accent_foreground = "#000000"

[colors.main_window]
border = "#313443"

[colors.accents]
blue = "#7aa2f7"
green = "#9ece6a"
magenta = "#bb9af7"
orange = "#ff9e64"
purple = "#bb9af7"
red = "#f7768e"
yellow = "#e0af68"
cyan = "#7dcfff"

[colors.text]
default = "#c0caf5"
muted = "#737aa2"
danger = "#f7768e"
success = "#9ece6a"

[colors.text.selection]
background = "#7aa2f7"
foreground = "#000000"

[colors.input]
border = "#313443"
border_focus = "#7aa2f7"
border_error = "#f7768e"

[colors.list.item.hover]
background = "#222430"
foreground = "#c0caf5"

[colors.list.item.selection]
background = "#292e42"
foreground = "#c0caf5"
secondary_background = "#2b2c3b"
secondary_foreground = "#c0caf5"

[colors.grid.item]
background = "#24283b"

[colors.grid.item.selection]
outline = "#7aa2f7"

[colors.loading]
bar = "#7aa2f7"
spinner = "#7aa2f7"
