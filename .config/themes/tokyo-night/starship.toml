"$schema" = "https://starship.rs/config-schema.json"
format = "$directory$git_branch$git_status$python$rust$golang$nodejs\n$character"
palette = "theme"
[directory]
style = "bold foreground"
truncation_length = 3
[git_branch]
symbol = "󰘬 "
style = "accent"
[git_status]
style = "muted"
[python]
style = "yellow"
[rust]
style = "orange"
[golang]
style = "cyan"
[nodejs]
style = "green"
[character]
success_symbol = "[❯](accent)"
error_symbol = "[❯](bold error)"
[palettes.theme]
foreground = "#c0caf5"
muted = "#737aa2"
accent = "#7aa2f7"
yellow = "#e0af68"
orange = "#ff9e64"
cyan = "#7dcfff"
green = "#9ece6a"
error = "#f7768e"
