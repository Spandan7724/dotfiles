# Make user apps the only thing systemd-oomd may kill.
#
# Hyprland runs in session.slice as wayland-wm@hyprland.desktop.service; apps
# started through uwsm-app (keybinds.lua app(), the Quickshell launcher) land
# in app.slice/app-*.scope. Marking only app.slice keeps the compositor out of
# the candidate pool: oomd kills the browser or build that caused the pressure
# and the session survives. Thresholds: /etc/systemd/oomd.conf.d/10-dotfiles.conf.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMSwap=kill
