# Fallback wallpaper colors. Matugen overwrites this file on every wallpaper
# change; the tracked version keeps the lock screen readable before the first run.

$lockFg = rgba(ffffffff)
$lockFgMuted = rgba(c8c8c8cc)
$lockAccent = rgba(ffffffaa)
$lockCheck = rgba(ffffffaa)
$lockFail = rgba(ff6b6bcc)
$lockInner = rgba(00000000)
