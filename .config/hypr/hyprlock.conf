# ~/.config/hypr/hyprlock.conf
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# Colors come from two sourced fragments, both of which must exist: hyprlock
# treats a source= path that matches nothing as a fatal parse error. The theme
# Matugen is sourced first and the selected profile second. Named themes keep
# their own palette; Wallpaper Dark/Light intentionally leave it untouched.
source = ./hyprlock-colors.conf
source = ../themes/current/hyprlock.conf

$font = CaskaydiaCove Nerd Font

general {
    hide_cursor = false
}

auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning...
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 5
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = $lockInner

    outer_color = $lockAccent
    check_color = $lockCheck
    fail_color = $lockFail

    font_color = $lockFgMuted
    fade_on_empty = false
    rounding = 25

    font_family = $font
    placeholder_text = 
    fail_text = $PAMFAIL$FPRINTFAIL

    # check_text = Authenticating...
    # dots_text_format = *
    dots_size = 0.2
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, 0
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
    font_size = 70
    font_family = Iosevka
    color = $lockFg

    position = 0, -130
    halign = center
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 16
    font_family = $font
    color = $lockFgMuted

    position = 0, -250
    halign = center
    valign = top
}

label {
    text = cmd[update:1] ~/.config/hypr/scripts/now-playing.sh

    position = 0, -300
    halign = center
    valign = center

    font_size = 15
    color = $lockFg
}
label {
    text = cmd[update:1] ~/.config/hypr/scripts/now-playing.sh previous

    position = -40, -370
    halign = center
    valign = center
    font_size = 28
    color = $lockFg
    onclick = playerctl --player="$(~/.config/waybar/scripts/playerctl-active.sh)" previous
}

label {
    text = cmd[update:1] ~/.config/hypr/scripts/now-playing.sh pause

    position = 0, -370
    halign = center
    valign = center
    font_size = 28
    color = $lockFg
    onclick = playerctl --player="$(~/.config/waybar/scripts/playerctl-active.sh)" play-pause
}

label {
    text = cmd[update:1] ~/.config/hypr/scripts/now-playing.sh next

    position = 40, -370
    halign = center
    valign = center
    font_size = 28
    color = $lockFg
    onclick = playerctl --player="$(~/.config/waybar/scripts/playerctl-active.sh)" next
}

label {
    text = cmd[update:1] ~/.config/hypr/scripts/password-cursor.sh

    position = 0, 2
    halign = center
    valign = center

    font_size = 18
    font_family = $font
    color = $lockFg
} 
