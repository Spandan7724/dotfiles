# Fallback wallpaper colors. Matugen overwrites this file on every wallpaper
# change; the tracked version keeps notifications readable before the first run.

[urgency_low]
    background = "#141414e6"
    foreground = "#a2a2a2"
    frame_color = "#ffffff1a"

[urgency_normal]
    background = "#141414f2"
    foreground = "#f5f5f5"
    frame_color = "#ffffff2b"

[urgency_critical]
    background = "#1a1010f2"
    foreground = "#ffffff"
    frame_color = "#ff6b6b"
