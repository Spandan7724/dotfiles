[config]
version_check = false
fallback_color = "#808080"
prefer = "saturation"
caching = true
contrast = 0.0
source_color_index = 0

# Terminal-style hues, blended toward the wallpaper so they belong with it.
# They feed templates/palette.toml (the wallpaper themes' fish, fzf, cava...).
[config.custom_colors]
red = { color = "#e5534b", blend = true }
orange = { color = "#e8875a", blend = true }
yellow = { color = "#d7a95f", blend = true }
green = { color = "#6aab73", blend = true }
cyan = { color = "#4fb3b3", blend = true }
blue = { color = "#5b8fd6", blend = true }
magenta = { color = "#b07fd6", blend = true }

[config.wallpaper]
set = false
command = "awww img {{ image }}"

[templates.quickshell]
input_path = "~/.config/matugen/templates/quickshell.json"
output_path = "~/.config/quickshell/theme.json"
type = "SchemeTonalSpot"

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar.css"
output_path = "~/.config/waybar/colors.css"
type = "SchemeTonalSpot"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi.rasi"
output_path = "~/.config/rofi/colors.rasi"
type = "SchemeTonalSpot"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/colors.conf"
type = "SchemeTonalSpot"

[templates.dunst]
input_path = "~/.config/matugen/templates/dunst.conf"
output_path = "~/.config/dunst/dunstrc.d/40-colors.conf"
type = "SchemeTonalSpot"

[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock.conf"
output_path = "~/.config/hypr/hyprlock-colors.conf"
type = "SchemeTonalSpot"

[templates.wlogout]
input_path = "~/.config/matugen/templates/wlogout.css"
output_path = "~/.config/wlogout/colors.css"
type = "SchemeTonalSpot"

[templates.thunar]
input_path = "~/.config/matugen/templates/thunar-colors.css"
output_path = "~/.config/gtk-3.0/thunar-colors.css"
type = "SchemeTonalSpot"

[templates.palette]
input_path = "~/.config/matugen/templates/palette.toml"
output_path = "~/.local/state/dotfiles-wallpaper-palette.toml"
type = "SchemeTonalSpot"
