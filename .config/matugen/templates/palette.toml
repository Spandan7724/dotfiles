# The wallpaper's palette in colors.toml form, written by Matugen. wallpaper.sh
# adds the mode and copies it into the active wallpaper theme, where
# generate.py --extras turns it into the GTK, Qt, fish, fzf, zathura, and cava
# colours.
background = "{{ colors.surface.default.hex }}"
lighter_background = "{{ colors.surface_container_high.default.hex }}"
selection = "{{ colors.secondary_container.default.hex }}"
foreground = "{{ colors.on_surface.default.hex }}"
muted = "{{ colors.on_surface_variant.default.hex }}"
accent = "{{ colors.primary.default.hex }}"

red = "{{ colors.red.default.hex }}"
orange = "{{ colors.orange.default.hex }}"
yellow = "{{ colors.yellow.default.hex }}"
green = "{{ colors.green.default.hex }}"
cyan = "{{ colors.cyan.default.hex }}"
blue = "{{ colors.blue.default.hex }}"
magenta = "{{ colors.magenta.default.hex }}"

error = "{{ colors.error.default.hex }}"
