# Generated by Matugen from the current wallpaper. Do not edit by hand.
# Loaded after the theme profile drop-in, so wallpaper colors win.

[urgency_low]
    background = "#{{ colors.surface_container.default.hex_stripped }}e6"
    foreground = "{{ colors.on_surface_variant.default.hex }}"
    frame_color = "{{ colors.outline_variant.default.hex }}"

[urgency_normal]
    background = "#{{ colors.surface_container.default.hex_stripped }}f2"
    foreground = "{{ colors.on_surface.default.hex }}"
    frame_color = "{{ colors.outline.default.hex }}"

[urgency_critical]
    background = "#{{ colors.error_container.default.hex_stripped }}f2"
    foreground = "{{ colors.on_error_container.default.hex }}"
    frame_color = "{{ colors.error.default.hex }}"
