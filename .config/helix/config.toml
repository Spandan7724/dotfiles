
# Follows the desktop theme: themes/apply.sh links themes/dotfiles.toml to
# ~/.config/themes/current/helix.toml.
theme = "dotfiles"

[editor]
line-number = "absolute"
mouse = true
cursorline = true
bufferline = "multiple"
color-modes = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.lsp]
display-inlay-hints = true

