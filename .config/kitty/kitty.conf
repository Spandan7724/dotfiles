include colors.conf
include ../themes/current/kitty.conf

font_family JetBrainsMono Nerd Font
font_size 10
confirm_os_window_close 0
# Hyprland sizes windows; remembering size also remembered "maximized" and
# reopened every new terminal maximized.
remember_window_size no

shell_integration enabled

cursor_shape beam
cursor_blink_interval 0.5

# Universal copy/paste (Super+C / Super+V) sends these to terminals.
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard

# Text size override from the Display panel (hypr/scripts/display.sh).
globinclude text-size.conf
