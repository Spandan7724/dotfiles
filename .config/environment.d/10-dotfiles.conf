# Session environment shared by every shell and every GUI app.
#
# Put PATH entries and exported variables here rather than in .bashrc,
# .zshrc or config.fish, so switching the login shell never loses them.
# The format is systemd's environment.d(5): KEY=VALUE, with $VAR and
# ${VAR} expanded. hyprland.lua applies this file at startup, and
# `hyprctl reload` re-applies it without logging out. Afterwards only new
# terminals and apps see the change.

PATH=$HOME/.local/bin:${PATH}

# Monochrome eza defaults. Application color schemes can be coordinated with
# the desktop theme independently of the shell initialization.
EZA_COLORS=uu=bright-black:gu=bright-black:da=bright-black:ur=white:uw=bright-black:ux=white:ue=bright-black:gr=bright-black:gw=bright-black:gx=white:tr=bright-black:fi=white:di=bright-white:ln=bright-black:pi=bright-black:so=bright-black:bd=bright-black:cd=bright-black:or=bright-black:mi=bright-black:ex=white
